<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="formstyle.css">
</head>
<body>
    <header>
        <h1>Emma's Web Design Site</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <main>
        <h2>Forms</h2>
        <div id="message"></div>
        <form action="formprocessing.html" method="post" id="myform">
            <fieldset>
                <legend>Account</legend>
                <div class="formbreak">
                    <label for="person">Full Name</label>
                    <input id="person" type="text" name="personname" placeholder="Full Name">
                </div>
                <div class="formbreak">
                    <label for="email">Email</label>
                    <input id="email" type="text" name="emailname" placeholder="janedoe@email.com">
                </div>
                <div class="formbreak">
                    <label for="pass">Password</label>
                    <input id="passname" type="password" name="passwords">
                </div>
                <div class="formbreak">
                    <label for="states">States</label>
                    <select name="state" id="statename">
                        <option value="blank">-------</option>
                        <option value="IL">Illinois</option>
                        <option value="HI">Hawaii</option>
                        <option value="WV">West Virginia</option>
                    </select>
                </div>
                <div class="checkbreak">
                    <div class="spacer">Gender</div>
                    <label for="radios"><input id="radioname" type="radio" name="gender">Male</label>
                    <label for="radios"><input id="radioname" type="radio" name="gender">Female</label>
                </div>
                <div class="checkbreak">
                    <div class="spacer">Y/N?</div>
                    <label for="checks"><input id="checkname" type="checkbox" name="checkboxes">Yes</label>
                    <label for="checks"><input id="checkname" type="checkbox" name="checkboxes">No</label>
                </div>
                <div class="formbreak">
                    <label for="numbered">Number</label>
                    <input id="numname" type="number" name="numbers">
                </div>
                <div class="formbreak">
                    <label for="comment">Comments</label>
                    <textarea name="comments" id="commentname">
                    </textarea>
                </div>
                <div class="formbreak">
                    <label for="colored">Color Picker</label>
                    <input id="colorname" type="color" name="colors">
                </div>
                <div class="formbreak">
                    <div class="spacer"></div>
                    <input type="submit">
                </div>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy;2026 Emma Gibson</p>
    </footer>
    <script src="formprocessing.js"></script>
</body>
</html>
