<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Project</title>
    <link rel="stylesheet" href="formprostyle.css">
    <link rel="shortcut icon" href="favicon(2).jpg" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Catty Questions</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <main>
        <h2>Project</h2>
        <form action="formsprojprocessing.html" method="post">
            <fieldset>
                <legend>Sign up for news about cats here!</legend>
                <div class="formbreak">
                    <label for="username">Email</label>
                    <input id="username" type="text" name="username" placeholder="ilovecats@email.com">
                </div>
                <div class="formbreak">
                    <label for="passname">Passowrd</label>
                    <input id="passname" type="password" name="passname">
                </div>
                <div class="formbreak">
                    <label for="datename">Today's Date</label>
                    <input id="datename" type="date" name="datename">
                </div>
                <div class="formbreak">
                    <div class="spacer"></div>
                    <input type="submit">
                </div>
            </fieldset>
            <fieldset>
                <legend>Begin!</legend>
                <div class="formbreak">
                    <label for="textname">What are cats with spots of white fur ontop of their colored fur called?</label>
                    <input id="textname" type="text" name="textname" placeholder="answer here!">
                </div>
                <div class="formbreak">
                    <label for="areaname">What are three difference between domestic cats and big cats?</label>
                    <textarea name="areaname" id="areaname"></textarea>
                </div>
                <div class="checkbreak">
                    <div class="spacer">A domestic cat's fur can be what colors?</div>
                    <label for="checkname"><input id="checkname" type="checkbox" name="checkname">Mauve</label>
                    <label for="checkname"><input id="checkname" type="checkbox" name="checkname">Black</label>
                    <label for="checkname"><input id="checkname" type="checkbox" name="checkname">Grey</label>
                    <label for="checkname"><input id="checkname" type="checkbox" name="checkname">Green</label>
                    <label for="checkname"><input id="checkname" type="checkbox" name="checkname">Orange</label>
                    <label for="checkname"><input id="checkname" type="checkbox" name="check">Vermillion</label>
                    <label for="checkname"><input id="checkname" type="checkbox" name="checkname">White</label>
                </div>
                <div class="checkbreak">
                    <div class="spacer">Which cat species is not real?</div>
                    <label for="radioname"><input id="radioname" type="radio" name="radioname">Leptailurus serval</label>
                    <label for="radioname"><input id="radioname" type="radio" name="radioname">Neofelis pravum</label>
                    <label for="radioname"><input id="radioname" type="radio" name="radioname">Puma concolor</label>
                    <label for="radioname"><input id="radioname" type="radio" name="radioname">Otocolobus manul</label>
                    <label for="radioname"><input id="radioname" type="radio" name="radioname">Felis catus</label>
                </div>
                <div class="formbreak">
                    <label for="selectname">Which cat breed is the most common?</label>
                    <select name="selectname" id="selectname">
                        <option value="blank">------------</option>
                        <option value="sia">Siamese</option>
                        <option value="ash">American Shorthair</option>
                        <option value="dsh">Domestic Shorthair</option>
                        <option value="mac">Main Coon</option>
                        <option value="dlh">Domestic Longhair</option>
                        <option value="rag">Ragdoll</option>
                    </select>
                </div>
                <div class="formbreak">
                    <label for="numbname">How many cat breeds are there currently?</label>
                    <input id="numbname" type="number" name="numbname">
                </div>
                <div class="formbreak">
                    <div class="spacer"></div>
                    <input type="submit">
                </div>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy;2026 Emma Gibson</p>
    </footer>
</body>
</html>
